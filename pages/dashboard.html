<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Beranda - STARFALL: REACH STARS</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body data-root="../" data-access="auth">
        <div class="wrap">
            <h1>BERANDA</h1>
            <p>Selamat datang, <b id="un"></b>!</p>
            <a class="btn big" href="game.html">PLAY GAME</a>
            <div class="grid">
                <div class="card stat">
                    <small>High Score</small><b id="hs">0</b>
                </div>
                <div class="card stat">
                    <small>Waktu Terbaik</small><b id="bt">00:00</b>
                </div>
                <div class="card stat">
                    <small>Total Game</small><b id="gp">0</b>
                </div>
                <div class="card stat">
                    <small>Musuh Dihancurkan</small><b id="kl">0</b>
                </div>
            </div>
            <div class="card">
                <h2>Leaderboard Lokal</h2>
                <table id="lb"></table>
                <small>Leaderboard lokal: hanya tersimpan di browser ini, bukan leaderboard online.</small>
            </div>
        </div>
        <script src="../js/storage.js"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/main.js"></script>
        <script src="../js/dashboard.js"></script>
    </body>
</html>
