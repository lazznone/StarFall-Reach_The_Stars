<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Game - STARFALL: REACH STARS</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body data-root="../" data-access="auth" data-nav="off" data-bg="off">
        <div style="width:100%">
            <div id="gwrap">
                <div id="hud">
                    <span>SKOR <b id="sc">0</b></span>
                    <span>WAKTU <b id="tm">00:00</b></span>
                    <span>HP <i id="hp"><i id="hpf"></i></i></span>
                    <button class="btn sm" id="pb" aria-label="Pause">II</button>
                </div>
                <canvas id="cv" width="480" height="720"></canvas>
                <div id="pause">
                    <h2>PAUSE</h2>
                    <button class="btn" id="rs">Lanjut</button>
                    <a class="btn" href="dashboard.html">Dashboard</a>
                </div>
                <div id="over">
                    <h2>GAME OVER</h2>
                    <p>Skor: <b id="fs"></b></p>
                    <p>Terbaik: <b id="bs"></b></p>
                    <p>Waktu: <b id="ft"></b></p>
                    <button class="btn" id="re">Main Lagi</button>
                    <a class="btn" href="dashboard.html">Dashboard</a>
                </div>
            </div>
        </div>
        <script src="../js/storage.js"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/main.js"></script>
        <script src="../js/assets.js"></script>
        <script src="../js/game.js"></script>
    </body>
</html>
