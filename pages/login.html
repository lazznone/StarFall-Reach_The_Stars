<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Login - STARFALL: REACH STARS</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body data-root="../" data-access="guest">
        <div class="wrap">
            <h1>LOGIN</h1>
            <form id="loginForm" class="card">
                <label for="u">Username</label>
                <input id="u" name="u" required autocomplete="username">
                <label for="p">Password</label>
                <div class="pw">
                    <input id="p" name="p" type="password" required autocomplete="current-password">
                    <button type="button" class="eye" aria-label="Tampilkan password"></button>
                </div>
                <p id="msg" role="alert"></p>
                <button class="btn" type="submit">Login</button>
                <p><a href="register.html">Belum punya akun? Register</a></p>
            </form>
        </div>
        <script src="../js/storage.js"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/main.js"></script>
    </body>
</html>
